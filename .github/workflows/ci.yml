name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --workspaces

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      # Each service now generates its Prisma client into its own
      # services/<svc>/node_modules/.prisma/<svc> directory (see the
      # `output` block in each prisma/schema.prisma) so the previous
      # "last writer wins" hoisting gotcha is gone. Build services in any
      # order — each build step still regenerates its own client first as
      # belt-and-braces in case the schema was edited since install.
      - name: Build (typecheck) all services
        run: |
          for svc in admin auth cart gateway notification order payment product search user; do
            echo "=== generate + build $svc ==="
            (cd services/$svc && npx prisma generate) || exit 1
            npm run build --workspace=services/$svc || exit 1
          done

  test:
    name: Test
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Init database schemas
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d ecommerce -f infra/postgres/init-scripts/init-schemas.sql
        env:
          PGPASSWORD: postgres

      # Each service's `npm run prisma:generate` writes to its own
      # services/<svc>/node_modules/.prisma/<svc>, so we generate them
      # individually in any order — no more workspace-wide hoisting
      # issue. The matching `prisma db push` immediately below uses the
      # freshly-generated client.
      - name: Generate Prisma clients
        run: |
          for svc in admin auth cart gateway notification order payment product search user; do
            echo "=== generate $svc ==="
            (cd services/$svc && npm run prisma:generate) || exit 1
          done

      - name: Push Prisma schemas
        run: |
          for pair in auth=auth gateway=gateway user=user_service product=product_service cart=cart_service order=order_schema payment=payment_service notification=notification_service search=search_service admin=admin_service; do
            name="${pair%%=*}"
            schema="${pair#*=}"
            echo "=== $name (schema: $schema) ==="
            DATABASE_URL="postgresql://postgres:postgres@localhost:5432/ecommerce?schema=$schema" \
              npx --prefix services/$name prisma db push --accept-data-loss 2>&1 | tail -5
          done

      - name: Run tests
        run: npm run test --workspaces
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  api-test:
    name: API Tests
    runs-on: ubuntu-22.04
    needs: [typecheck, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Init DB + Prisma
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d ecommerce -f infra/postgres/init-scripts/init-schemas.sql
          for svc in admin auth cart gateway notification order payment product search user; do
            echo "=== generate $svc ==="
            (cd services/$svc && npm run prisma:generate) || exit 1
          done
          for pair in auth=auth gateway=gateway user=user_service product=product_service cart=cart_service order=order_schema payment=payment_service notification=notification_service search=search_service admin=admin_service; do
            name="${pair%%=*}"
            schema="${pair#*=}"
            echo "=== $name (schema: $schema) ==="
            DATABASE_URL="postgresql://postgres:postgres@localhost:5433/ecommerce?schema=$schema" \
              npx --prefix services/$name prisma db push --accept-data-loss 2>&1 | tail -3
          done

      - name: Start all services
        run: |
          for svc in auth gateway user product cart order payment notification search admin; do
            case $svc in
              auth) schema=auth;;
              gateway) schema=gateway;;
              user) schema=user_service;;
              product) schema=product_service;;
              cart) schema=cart_service;;
              order) schema=order_schema;;
              payment) schema=payment_service;;
              notification) schema=notification_service;;
              search) schema=search_service;;
              admin) schema=admin_service;;
            esac
            DATABASE_URL="postgresql://postgres:postgres@localhost:5433/ecommerce?schema=$schema" \
            REDIS_URL="redis://localhost:6379" \
            npm run dev:$svc &
            sleep 2
          done
          sleep 10

      - name: Run API test suite
        run: bash scripts/api-test.sh
        env:
          BASE_URL: http://localhost:3000