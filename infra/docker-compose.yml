x-common-env: &common-env
  NODE_ENV: production
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
  RATE_LIMIT_WINDOW_MS: 900000
  RATE_LIMIT_MAX_REQUESTS: 100
  LOG_LEVEL: info

x-redis-env: &redis-env
  REDIS_URL: redis://redis:6379

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: guest
  RABBITMQ_PASS: guest

services:
  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-scripts/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ecommerce-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # ── Services ────────────────────────────────────────────────

  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
    container_name: ecommerce-gateway
    ports:
      - "3000:3000"
    environment:
      <<: [*common-env, *redis-env]
      PORT: 3000
      SERVICE_NAME: api-gateway
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too}
      AUTH_SERVICE_URL: http://auth:3001
      USER_SERVICE_URL: http://user:3002
      PRODUCT_SERVICE_URL: http://product:3003
      CART_SERVICE_URL: http://cart:3004
      ORDER_SERVICE_URL: http://order:3005
      PAYMENT_SERVICE_URL: http://payment:3006
      NOTIFICATION_SERVICE_URL: http://notification:3007
      SEARCH_SERVICE_URL: http://search:3008
      ADMIN_SERVICE_URL: http://admin:3009
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - ecommerce-network

  auth:
    build:
      context: ../services/auth
      dockerfile: Dockerfile
    container_name: ecommerce-auth
    ports:
      - "3001:3001"
    environment:
      <<: [*common-env, *redis-env]
      PORT: 3001
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce?schema=auth
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - ecommerce-network

  user:
    build:
      context: ../services/user
      dockerfile: Dockerfile
    container_name: ecommerce-user
    ports:
      - "3002:3002"
    environment:
      <<: [*common-env, *redis-env, *rabbitmq-env]
      PORT: 3002
      SERVICE_NAME: user-service
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce?schema=user_service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - ecommerce-network

  product:
    build:
      context: ../services/product
      dockerfile: Dockerfile
    container_name: ecommerce-product
    ports:
      - "3003:3003"
    environment:
      <<: [*common-env, *redis-env, *rabbitmq-env]
      PORT: 3003
      SERVICE_NAME: product-service
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce?schema=product_service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - ecommerce-network

  cart:
    build:
      context: ../services/cart
      dockerfile: Dockerfile
    container_name: ecommerce-cart
    ports:
      - "3004:3004"
    environment:
      <<: [*common-env, *redis-env]
      PORT: 3004
      SERVICE_NAME: cart-service
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce?schema=cart_service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - ecommerce-network

  order:
    build:
      context: ../services/order
      dockerfile: Dockerfile
    container_name: ecommerce-order
    ports:
      - "3005:3005"
    environment:
      <<: [*common-env, *redis-env, *rabbitmq-env]
      PORT: 3005
      SERVICE_NAME: order-service
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce?schema=order_schema
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - ecommerce-network

  payment:
    build:
      context: ../services/payment
      dockerfile: Dockerfile
    container_name: ecommerce-payment
    ports:
      - "3006:3006"
    environment:
      <<: [*common-env, *rabbitmq-env]
      PORT: 3006
      SERVICE_NAME: payment-service
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce?schema=payment_service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - ecommerce-network

  notification:
    build:
      context: ../services/notification
      dockerfile: Dockerfile
    container_name: ecommerce-notification
    ports:
      - "3007:3007"
    environment:
      <<: [*common-env, *rabbitmq-env]
      PORT: 3007
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce?schema=notification_service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - ecommerce-network

  search:
    build:
      context: ../services/search
      dockerfile: Dockerfile
    container_name: ecommerce-search
    ports:
      - "3008:3008"
    environment:
      <<: [*common-env, *rabbitmq-env]
      PORT: 3008
      SERVICE_NAME: search-service
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce?schema=search_service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - ecommerce-network

  admin:
    build:
      context: ../services/admin
      dockerfile: Dockerfile
    container_name: ecommerce-admin
    ports:
      - "3009:3009"
    environment:
      <<: [*common-env, *redis-env]
      PORT: 3009
      SERVICE_NAME: admin-service
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce?schema=admin_service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - ecommerce-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  ecommerce-network:
    driver: bridge
